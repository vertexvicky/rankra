<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Algorithmic Choice List Maker | Rankra - TNEA</title>
    <meta name="description" content="TNEA Algorithmic Choice List Maker generated based on community, rank buffer and branch preferences." />
    <link rel="icon" type="image/jpeg" href="../../assets/rankra_favicon30.jpg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="../../shared/css/tokens.css" />
    <link rel="stylesheet" href="../../shared/css/reset.css" />
    <link rel="stylesheet" href="../../shared/css/layout.css" />
    <link rel="stylesheet" href="maker.css" />
</head>
<body class="dark">
    <header class="site-header" role="banner">
        <div class="header-inner">
            <a href="/" class="brand-link">
                <span class="brand-text">Rankra</span>
            </a>
            <button id="theme-toggle" class="btn-icon" aria-label="Toggle theme">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </header>

    <main class="maker-main">
        <div class="maker-container">
            <div class="maker-card summary-card">
                <h1 class="maker-title">Algorithmic Choice List</h1>
                <div id="params-summary" class="params-grid"></div>
            </div>

            <div class="maker-card content-card">
                <div class="results-header">
                    <h2 class="results-title">Generated Choices</h2>
                    <span id="choice-count" class="badge-count">0 Choices</span>
                </div>

                <div id="loading-state" class="loading-state">
                    <div class="spinner"></div>
                    <p>Generating your choice list based on tiers and predictions...</p>
                </div>

                <div id="error-state" class="error-state hidden">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <p id="error-message">Missing required URL parameters.</p>
                </div>

                <div id="choices-wrapper" class="choices-wrapper hidden">
                    <div class="choices-table-header">
                        <div class="sort-header" data-sort="default">
                            <span>#</span> <i class="fa-solid fa-sort sort-icon"></i>
                        </div>
                        <div class="sort-header" data-sort="college">
                            <span>College</span> <i class="fa-solid fa-sort sort-icon"></i>
                        </div>
                        <div class="sort-header" data-sort="branch">
                            <span>Branch</span> <i class="fa-solid fa-sort sort-icon"></i>
                        </div>
                        <div class="sort-header" data-sort="tier">
                            <span>Tier</span> <i class="fa-solid fa-sort sort-icon"></i>
                        </div>
                        <div class="sort-header" data-sort="rank">
                            <span>Pred. Rank</span> <i class="fa-solid fa-sort sort-icon"></i>
                        </div>
                    </div>
                    <ol id="choices-list" class="choices-list"></ol>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="maker.js"></script>
</body>
</html>
