<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colleges | Rankra - TNEA</title>
  <meta name="description" content="Search all 430+ TNEA engineering colleges with cutoff ranges and projections.">
  <link rel="icon" type="image/png" href="../../assets/rankra_favicon30.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../../shared/css/tokens.css">
  <link rel="stylesheet" href="../../shared/css/reset.css">
  <link rel="stylesheet" href="../../shared/css/animations.css">
  <link rel="stylesheet" href="../../shared/css/components.css">
  <link rel="stylesheet" href="../../shared/css/layout.css">
  <link rel="stylesheet" href="index.css?v=2">
</head>
<body class="dark">

  <header class="site-header" role="banner"></header>
  <div class="college-filter-bar">
    <div class="college-filter-container">

      <!-- Row 1: Cutoff + Community -->
      <div class="filter-row">
        <div class="toggle-group" id="filter-type-toggle">
          <button class="toggle-btn active" data-type="cutoff">Mark</button>
          <button class="toggle-btn" data-type="rank">Rank</button>
        </div>
        <div class="search-box-wrap" style="width:72px;flex:none;">
          <input type="number" id="cutoffSearch" class="search-input cutoff-input" placeholder="200.0" step="0.5" min="0" max="200" value="200" style="padding:8px 4px;text-align:center;">
        </div>
        <span class="filter-label">community</span>
        <div class="district-wrap" id="comm-wrap">
          <button class="pill-btn" id="comm-btn" aria-haspopup="true" aria-expanded="false">
            <span id="comm-btn-text">OC</span>
            <svg class="chevron" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="sort-dropdown" id="comm-dropdown" hidden style="min-width:100px;">
            <div class="sort-option active" data-value="OC">OC</div>
            <div class="sort-option" data-value="BC">BC</div>
            <div class="sort-option" data-value="BCM">BCM</div>
            <div class="sort-option" data-value="MBC">MBC</div>
            <div class="sort-option" data-value="SC">SC</div>
            <div class="sort-option" data-value="SCA">SCA</div>
            <div class="sort-option" data-value="ST">ST</div>
          </div>
        </div>
      </div>

      <!-- Row 2: Year | Course | Type -->
      <div class="filter-row filter-row-chips">
        <div class="district-wrap" id="year-wrap">
          <button class="pill-btn" id="year-btn" aria-haspopup="true" aria-expanded="false">
            <span id="year-btn-text">2025</span>
            <svg class="chevron" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="sort-dropdown" id="year-dropdown" hidden style="min-width:110px;">
            <div class="sort-option" data-value="2024">2024</div>
            <div class="sort-option active" data-value="2025">2025</div>
          </div>
        </div>

        <div class="district-wrap" id="course-wrap">
          <button class="pill-btn" id="course-btn" aria-haspopup="listbox" aria-expanded="false">
            <span id="course-label">Course (all)</span>
            <svg class="chevron" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>

        <div class="district-wrap" id="type-wrap">
          <button class="pill-btn" id="type-btn" aria-haspopup="listbox" aria-expanded="false">
            <span id="type-label">College Type</span>
            <svg class="chevron" id="type-chevron" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>
      </div>

      <!-- Row 3: Search Bar + District -->
      <div class="filter-row">
        <div class="search-box-wrap full-width">
          <input type="text" id="collegeSearch" class="search-input" placeholder="Search by college name, code or district…" autocomplete="off">
        </div>
        <div class="district-wrap" id="district-wrap">
          <button class="pill-btn" id="district-btn" aria-haspopup="listbox" aria-expanded="false">
            <span id="district-label">District (all)</span>
            <svg class="chevron" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>
      </div>

    </div>
  </div>

  <main class="college-main">
    <div id="collegeList" class="college-list"></div>
  </main>

  <script type="module" src="college.js?v=2"></script>
  <script type="module" src="../../shared/components/auth/auth.js"></script>
</body>
</html>
